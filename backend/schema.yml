        schema:
          type: string
          enum:
          - CREDIT
          - FULL_RETURN
          - PARTIAL_RETURN
          - REPLACEMENT
        description: |-
          * `FULL_RETURN` - Full Return to Vendor
          * `PARTIAL_RETURN` - Partial Return of Damaged Units
          * `REPLACEMENT` - Vendor Replacement
          * `CREDIT` - Credit Note Requested
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CREDITED
          - DISPATCHED_TO_VENDOR
          - REPLACED
          - REQUESTED
        description: |-
          * `REQUESTED` - Return Requested
          * `DISPATCHED_TO_VENDOR` - Dispatched to Vendor
          * `REPLACED` - Replacement Received
          * `CREDITED` - Credit Note Received
          * `CANCELLED` - Cancelled
      - in: query
        name: vendor
        schema:
          type: string
          format: uuid
