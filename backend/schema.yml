openapi: 3.0.3
info:
  title: Startup ERP REST API
  version: 1.0.0
  description: Production-ready Inventory, Purchase, Production, Sales & ERP API for
    Incense & Fragrance Manufacturing
paths:
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - APPROVE
          - CANCEL
          - CREATE
          - DELETE
          - DISPATCH
          - LOGIN
          - LOGOUT
          - RECEIVE
          - REJECT
          - UPDATE
          - VERIFY
        description: |-
          * `CREATE` - Created
          * `UPDATE` - Updated
          * `DELETE` - Soft Deleted
          * `APPROVE` - Approved
          * `REJECT` - Rejected
          * `VERIFY` - Verified
          * `DISPATCH` - Dispatched
          * `RECEIVE` - Received
          * `CANCEL` - Cancelled
          * `LOGIN` - User Login
          * `LOGOUT` - User Logout
      - in: query
        name: module
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Audit Log.
        required: true
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
