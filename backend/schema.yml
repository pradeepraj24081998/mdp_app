components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/AuditLogActionEnum'
        module:
          type: string
          maxLength: 50
        object_id:
          type: string
          maxLength: 100
        object_repr:
          type: string
          maxLength: 255
        old_value:
          nullable: true
        new_value:
          nullable: true
        ip_address:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - id
      - module
      - object_id
      - timestamp
      - user_email
      - user_name
    AuditLogActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - APPROVE
      - REJECT
      - VERIFY
      - DISPATCH
      - RECEIVE
      - CANCEL
      - LOGIN
      - LOGOUT
      type: string
      description: |-
        * `CREATE` - Created
        * `UPDATE` - Updated
        * `DELETE` - Soft Deleted
        * `APPROVE` - Approved
        * `REJECT` - Rejected
        * `VERIFY` - Verified
        * `DISPATCH` - Dispatched
        * `RECEIVE` - Received
        * `CANCEL` - Cancelled
        * `LOGIN` - User Login
        * `LOGOUT` - User Logout
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer_code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        contact_person:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        pincode:
          type: string
          maxLength: 20
        gst_number:
          type: string
          maxLength: 30
        credit_limit:
          type: string
